<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<title>Satisfy Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Layout: phone-first list of categories, two game tiles per row. */
:root{
  --bg:#12151a; --panel:#1d222a; --panel2:#272e38; --ink:#f3f0e8; --muted:#9aa3ad; --accent:#ffb020;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1}
h1 span{color:var(--accent)}
.coins{background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.install{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.install button{font:inherit;font-weight:900;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#1d1400;cursor:pointer;flex:0 0 auto}
.install p{margin:0;flex:1;line-height:1.4}
section{display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--panel);border-radius:16px;overflow:hidden;min-width:0;transition:transform .1s}
.card:active{transform:scale(.97)}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.art{aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.art svg{width:62%;height:auto}
.meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.meta b{font-size:15px}
.meta span{font-size:12px;color:var(--muted);line-height:1.35}
.meta i{font-style:normal;font-size:11px;color:var(--accent);font-weight:800;margin-top:4px}
footer{color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <header><h1>Satisfy<br><span>Arcade</span></h1><div class="coins" id="coins">● 0</div></header>
  <div class="install" id="install" hidden><p id="installTxt">Installe l'appli sur ton écran d'accueil pour jouer en plein écran, même hors ligne.</p><button id="installBtn">Installer</button></div>
  <div id="cats"></div>
  <footer>10 jeux · tes pièces sont partagées entre tous les jeux</footer>
</main>
<script>
const CATS=[
  {t:'Foule et chiffres',g:[
    {id:'squad-rush',best:null,n:'Squad Rush',d:'Grossis ton escouade, abats le colosse',bg:'#d9a861',svg:'<rect x="10" y="30" width="80" height="40" rx="4" fill="#2f8cff" opacity=".8"/><text x="50" y="58" font-size="22" font-weight="900" fill="#fff" text-anchor="middle" font-family="system-ui">×2</text><circle cx="35" cy="85" r="6" fill="#1c3f80"/><circle cx="50" cy="88" r="6" fill="#1c3f80"/><circle cx="65" cy="85" r="6" fill="#1c3f80"/>'},
    {id:'hole',best:'hole',n:'Trou glouton',d:'Avale la ville pour grandir',bg:'#7dbb68',svg:'<circle cx="50" cy="55" r="30" fill="#0b0d10" stroke="#ffb020" stroke-width="4"/><rect x="70" y="18" width="18" height="12" rx="3" fill="#e84a3c"/><circle cx="20" cy="25" r="9" fill="#2f6b2c"/>'}
  ]},
  {t:'Satisfaisant',g:[
    {id:'sort',best:null,n:'Tri des couleurs',d:'Range chaque couleur dans son tube',bg:'#1b2230',svg:'<g stroke="#e6f0ff" stroke-width="3" fill="none"><path d="M18 20v52a9 9 0 0 0 18 0V20"/><path d="M41 20v52a9 9 0 0 0 18 0V20"/><path d="M64 20v52a9 9 0 0 0 18 0V20"/></g><rect x="19.5" y="56" width="15" height="22" fill="#ff4d4d"/><rect x="42.5" y="44" width="15" height="34" fill="#3fa9ff"/><rect x="65.5" y="60" width="15" height="18" fill="#ffd23f"/>'},
    {id:'helix',best:'helix',n:'Chute spirale',d:'Fais tomber la balle à travers la tour',bg:'#2b1f4a',svg:'<rect x="43" y="5" width="14" height="92" fill="#d8d2ea"/><ellipse cx="50" cy="30" rx="38" ry="12" fill="#3fd6a0"/><path d="M50 30 88 30A38 12 0 0 1 70 41z" fill="#2b1f4a"/><ellipse cx="50" cy="62" rx="38" ry="12" fill="#3fd6a0"/><path d="M14 62a38 12 0 0 1 20-10L50 62z" fill="#ff3b3b"/><rect x="43" y="18" width="14" height="12" fill="#d8d2ea"/><circle cx="72" cy="22" r="7" fill="#ff4fd8"/>'}
  ]},
  {t:'Puzzle',g:[
    {id:'merge',best:'merge',n:'Fusion 2048',d:'Glisse et fusionne les tuiles',bg:'#faf6ee',svg:'<rect x="14" y="14" width="34" height="34" rx="5" fill="#f2b179"/><rect x="52" y="14" width="34" height="34" rx="5" fill="#edcf72"/><rect x="14" y="52" width="34" height="34" rx="5" fill="#eee4da"/><rect x="52" y="52" width="34" height="34" rx="5" fill="#8f5bff"/><text x="69" y="76" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="system-ui">2048</text>'},
    {id:'blocks',best:'blocks',n:'Bloc puzzle',d:'Remplis les lignes de la grille',bg:'#24305a',svg:'<g fill="#3fa9ff"><rect x="15" y="15" width="22" height="22" rx="4"/><rect x="39" y="15" width="22" height="22" rx="4"/></g><g fill="#ffd23f"><rect x="63" y="15" width="22" height="22" rx="4"/><rect x="63" y="39" width="22" height="22" rx="4"/></g><g fill="#ff5a4f"><rect x="15" y="63" width="22" height="22" rx="4"/><rect x="39" y="63" width="22" height="22" rx="4"/><rect x="63" y="63" width="22" height="22" rx="4"/></g>'}
  ]},
  {t:'Réflexes',g:[
    {id:'knife',best:'knife',n:'Lancer de couteaux',d:'Plante-les sans toucher les autres',bg:'#2a3550',svg:'<circle cx="50" cy="40" r="26" fill="#b9783e"/><circle cx="50" cy="40" r="16" fill="none" stroke="#8d5626" stroke-width="3"/><path d="M50 95V70l4-6h-8l4 6" fill="#dfe6ee"/><rect x="47" y="80" width="6" height="16" rx="2" fill="#7a3b1d"/>'},
    {id:'stack',best:'stack',n:'Tour infinie',d:'Empile les blocs au millimètre',bg:'#6fa3c7',svg:'<path d="M50 70 80 55 50 40 20 55z" fill="#f2c46d"/><path d="M20 55v10l30 15V70z" fill="#c9963d"/><path d="M80 55v10L50 80V70z" fill="#dcaa50"/><path d="M50 50 76 37 50 24 24 37z" fill="#f58b8b"/><path d="M24 37v9l26 13v-9z" fill="#c96464"/><path d="M76 37v9L50 59v-9z" fill="#de7474"/>'}
  ]},
  {t:'Idle et gestion',g:[
    {id:'tycoon',best:null,n:'Empire idle',d:'De la citronnade à la fusée',bg:'#203a2c',svg:'<rect x="18" y="52" width="14" height="30" rx="3" fill="#3ddc84"/><rect x="38" y="40" width="14" height="42" rx="3" fill="#3ddc84"/><rect x="58" y="26" width="14" height="56" rx="3" fill="#7dff9b"/><text x="80" y="30" font-size="22" font-weight="900" fill="#ffd23f" font-family="system-ui">$</text>'},
    {id:'defense',best:'defense',n:'Dernière tour',d:'Défends ta tour contre les vagues',bg:'#1a2a22',svg:'<circle cx="50" cy="50" r="34" fill="none" stroke="#3ddc84" stroke-width="2" stroke-dasharray="5 5"/><circle cx="50" cy="50" r="13" fill="#5b7085"/><rect x="54" y="46" width="18" height="8" fill="#c9d6e3"/><circle cx="16" cy="22" r="6" fill="#ff5a4f"/><circle cx="85" cy="78" r="5" fill="#ffd23f"/><rect x="12" y="74" width="12" height="12" fill="#b36bff"/>'}
  ]}
];
function get(k,d){try{const v=localStorage.getItem('arcade.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
const BEST={helix:'Niveau max',hole:'Record',merge:'Record',blocks:'Record',knife:'Niveau max',stack:'Hauteur max',defense:'Vague max'};
const cats=document.getElementById('cats');cats.style.cssText='display:flex;flex-direction:column;gap:22px';
for(const c of CATS){
  const s=document.createElement('section');const h=document.createElement('h2');h.textContent=c.t;s.appendChild(h);
  const g=document.createElement('div');g.className='grid';
  for(const x of c.g){
    const a=document.createElement('a');a.className='card';a.href='games/'+x.id+'.html';
    const b=x.best?get('best.'+x.best,0):0;
    const extra=x.id==='sort'?'Niveau '+get('sort.level',1):b?BEST[x.best]+' : '+b:'';
    a.innerHTML=`<div class="art" style="background:${x.bg}"><svg viewBox="0 0 100 100" aria-hidden="true">${x.svg}</svg></div><div class="meta"><b></b><span></span>${extra?'<i></i>':''}</div>`;
    a.querySelector('b').textContent=x.n;a.querySelector('span').textContent=x.d;if(extra)a.querySelector('i').textContent=extra;
    g.appendChild(a);
  }
  s.appendChild(g);cats.appendChild(s);
}
document.getElementById('coins').textContent='● '+get('coins',0);
// install
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone)document.getElementById('install').hidden=false;});
document.getElementById('installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('install').hidden=true;};
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)){
  document.getElementById('install').hidden=false;document.getElementById('installBtn').hidden=true;
  document.getElementById('installTxt').textContent='Pour installer : touche Partager puis « Sur l\'écran d\'accueil ».';
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('pageshow',()=>{document.getElementById('coins').textContent='● '+get('coins',0);});
</script>
</body>
</html>
