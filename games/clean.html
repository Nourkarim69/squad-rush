<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<title>Karcher</title>
<link rel="stylesheet" href="../shared/common.css">
</head>
<body>
<canvas class="game" id="c"></canvas>
<script src="../shared/common.js"></script>
<script>
Arcade.bar('Karcher');
const cv=document.getElementById('c'),V=Arcade.canvas(cv,()=>build()),ctx=V.ctx;
const BRUSH=24,STEP=7;
let itemIdx=Arcade.get('clean.idx',0),scene,dirt,dctx,cells=[],cleaned=0,last=null,ptr=null,drops=[],sparks=[],done=false,box;
const PAINTS=['#e84a3c','#2f8cff','#ffd23f','#3ddc84','#b36bff','#ff8c2e','#f5f5f5'];
const ITEMS=[
  {name:'Voiture',draw:drawCar},{name:'Maison',draw:drawHouse},{name:'Jante',draw:drawRim},{name:'Moto',draw:drawBike}
];
function off(w,h){const c=document.createElement('canvas');c.width=Math.round(w*V.dpr);c.height=Math.round(h*V.dpr);const x=c.getContext('2d');x.setTransform(V.dpr,0,0,V.dpr,0,0);return[c,x];}
function build(){
  const W=V.W,H=V.H;if(W<10)return;
  const item=ITEMS[itemIdx%ITEMS.length],color=PAINTS[(itemIdx*3)%PAINTS.length];
  const s=Math.min(W*0.9,H*0.62);
  box={x:(W-s)/2,y:(H-s)/2+10,s};
  let sx;[scene,sx]=off(W,H);
  item.draw(sx,box.x+s/2,box.y+s/2,s,color);
  [dirt,dctx]=off(W,H);
  item.draw(dctx,box.x+s/2,box.y+s/2,s,color);
  dctx.globalCompositeOperation='source-in';
  dctx.fillStyle='#5b4128';dctx.fillRect(0,0,W,H);
  dctx.globalCompositeOperation='source-atop';
  for(let i=0;i<500;i++){
    dctx.fillStyle=['#4a321d','#6d5034','#3d2a18','#7a5a3a'][i%4];
    dctx.globalAlpha=0.6;dctx.beginPath();dctx.arc(box.x+Math.random()*s,box.y+Math.random()*s,4+Math.random()*16,0,7);dctx.fill();
  }
  dctx.globalAlpha=1;dctx.globalCompositeOperation='source-over';
  const data=dctx.getImageData(0,0,dirt.width,dirt.height).data;
  cells=[];
  for(let y=box.y;y<box.y+s;y+=STEP)for(let x=box.x;x<box.x+s;x+=STEP){
    const px=Math.round(x*V.dpr),py=Math.round(y*V.dpr);
    if(data[(py*dirt.width+px)*4+3]>40)cells.push({x,y,c:false});
  }
  cleaned=0;done=false;
}
function eraseSeg(a,b){
  dctx.globalCompositeOperation='destination-out';
  dctx.lineCap='round';dctx.lineWidth=BRUSH*2;
  dctx.beginPath();dctx.moveTo(a.x,a.y);dctx.lineTo(b.x,b.y);dctx.stroke();
  dctx.globalCompositeOperation='source-over';
  const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
  for(const c of cells){
    if(c.c)continue;
    let t=((c.x-a.x)*dx+(c.y-a.y)*dy)/L2;t=t<0?0:t>1?1:t;
    const ex=a.x+dx*t-c.x,ey=a.y+dy*t-c.y;
    if(ex*ex+ey*ey<BRUSH*BRUSH*0.85){c.c=true;cleaned++;}
  }
}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top-34};}
cv.addEventListener('pointerdown',e=>{if(done)return;cv.setPointerCapture(e.pointerId);last=pos(e);ptr=last;eraseSeg(last,last);});
cv.addEventListener('pointermove',e=>{if(!last||done)return;const p=pos(e);eraseSeg(last,p);last=p;ptr=p;});
const up=()=>{last=null;ptr=null;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function finish(){
  done=true;dctx.clearRect(0,0,V.W,V.H);Arcade.vibrate([20,30,20]);
  for(let i=0;i<40;i++)sparks.push({x:box.x+Math.random()*box.s,y:box.y+Math.random()*box.s,life:0.6+Math.random()*0.8,r:4+Math.random()*8});
  const gain=Arcade.addCoins(12);itemIdx++;Arcade.set('clean.idx',itemIdx);
  setTimeout(()=>Arcade.panel({title:'Tout propre !',gain,text:'Comme neuf. On passe au suivant ?',
    buttons:[{label:'Suivant',onClick:build},{label:'Menu',onClick:Arcade.toMenu}]}),900);
}
function frame(dt,t){
  const W=V.W,H=V.H;if(!scene)return;
  ctx.fillStyle='#cfd6dc';ctx.fillRect(0,0,W,H*0.62);
  ctx.fillStyle='#b7c0c8';for(let x=0;x<W;x+=48)ctx.fillRect(x,0,2,H*0.62);
  ctx.fillStyle='#8a939c';ctx.fillRect(0,H*0.62,W,H*0.38);
  ctx.fillStyle='rgba(60,140,220,.25)';ctx.beginPath();ctx.ellipse(W/2,H*0.86,W*0.42,22,0,0,7);ctx.fill();
  ctx.drawImage(scene,0,0,W,H);ctx.drawImage(dirt,0,0,W,H);
  const pct=cells.length?cleaned/cells.length:0;
  if(!done&&pct>=0.965)finish();
  // progress
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.roundRect(20,14,W-40,26,13);ctx.fill();
  ctx.fillStyle='#35e0d0';ctx.beginPath();ctx.roundRect(23,17,Math.max(20,(W-46)*(done?1:pct)),20,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='900 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ITEMS[itemIdx%ITEMS.length].name+' · '+Math.floor((done?1:pct)*100)+'%',W/2,27);
  // jet
  if(ptr&&!done){
    const nx=W-30,ny=H-20;
    ctx.strokeStyle='#2b2f35';ctx.lineWidth=10;ctx.lineCap='round';
    const gx=ptr.x+(nx-ptr.x)*0.55,gy=ptr.y+(ny-ptr.y)*0.55;
    ctx.beginPath();ctx.moveTo(nx+30,ny+30);ctx.lineTo(gx,gy);ctx.stroke();
    ctx.strokeStyle='#ffcc00';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+(nx-gx)*0.25,gy+(ny-gy)*0.25);ctx.stroke();
    ctx.strokeStyle='rgba(180,225,255,.85)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(ptr.x,ptr.y);ctx.stroke();
    for(let i=0;i<4;i++){const a=Math.random()*6.28,v=60+Math.random()*160;drops.push({x:ptr.x,y:ptr.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:0.4});}
    ctx.fillStyle='rgba(200,235,255,.35)';ctx.beginPath();ctx.arc(ptr.x,ptr.y,BRUSH,0,7);ctx.fill();
  }
  for(const d of drops){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=500*dt;d.life-=dt;}
  drops=drops.filter(d=>d.life>0);
  ctx.fillStyle='rgba(170,215,255,.9)';for(const d of drops)ctx.fillRect(d.x-1.5,d.y-1.5,3,3);
  for(const s of sparks){s.life-=dt;const k=Math.max(0,s.life);ctx.fillStyle='rgba(255,255,255,'+Math.min(1,k*2)+')';
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(t*3);ctx.fillRect(-s.r*k,-1.5,s.r*2*k,3);ctx.fillRect(-1.5,-s.r*k,3,s.r*2*k);ctx.restore();}
  sparks=sparks.filter(s=>s.life>0);
}

// ---- items (drawn centered on cx,cy inside a square of size s) ----
function drawCar(c,cx,cy,s,col){
  const w=s*0.95,h=s*0.42,x=cx-w/2,y=cy-h/2;
  c.fillStyle=col;c.beginPath();c.moveTo(x,y+h*0.75);c.lineTo(x,y+h*0.45);c.quadraticCurveTo(x+w*0.05,y+h*0.32,x+w*0.2,y+h*0.3);
  c.lineTo(x+w*0.32,y);c.lineTo(x+w*0.7,y);c.lineTo(x+w*0.84,y+h*0.3);c.quadraticCurveTo(x+w,y+h*0.35,x+w,y+h*0.55);c.lineTo(x+w,y+h*0.75);c.closePath();c.fill();
  c.fillStyle='#bfe3ff';c.beginPath();c.moveTo(x+w*0.35,y+h*0.07);c.lineTo(x+w*0.49,y+h*0.07);c.lineTo(x+w*0.49,y+h*0.3);c.lineTo(x+w*0.26,y+h*0.3);c.fill();
  c.beginPath();c.moveTo(x+w*0.52,y+h*0.07);c.lineTo(x+w*0.68,y+h*0.07);c.lineTo(x+w*0.78,y+h*0.3);c.lineTo(x+w*0.52,y+h*0.3);c.fill();
  c.fillStyle='rgba(0,0,0,.15)';c.fillRect(x+w*0.02,y+h*0.55,w*0.96,h*0.06);
  c.fillStyle='#fff6c0';c.fillRect(x+w*0.93,y+h*0.42,w*0.06,h*0.1);c.fillStyle='#ff4040';c.fillRect(x+w*0.005,y+h*0.42,w*0.04,h*0.1);
  for(const wx of[0.22,0.78]){c.fillStyle='#1b1d21';c.beginPath();c.arc(x+w*wx,y+h*0.78,h*0.24,0,7);c.fill();c.fillStyle='#b9c2cc';c.beginPath();c.arc(x+w*wx,y+h*0.78,h*0.12,0,7);c.fill();}
}
function drawHouse(c,cx,cy,s,col){
  const w=s*0.8,h=s*0.5,x=cx-w/2,y=cy-h/2+s*0.12;
  c.fillStyle='#f1e3c8';c.fillRect(x,y,w,h);
  c.fillStyle=col;c.beginPath();c.moveTo(x-s*0.06,y);c.lineTo(cx,y-s*0.3);c.lineTo(x+w+s*0.06,y);c.fill();
  c.fillStyle='#7a4a2a';c.fillRect(cx-w*0.09,y+h*0.45,w*0.18,h*0.55);
  c.fillStyle='#bfe3ff';c.fillRect(x+w*0.1,y+h*0.2,w*0.22,h*0.28);c.fillRect(x+w*0.68,y+h*0.2,w*0.22,h*0.28);
  c.fillStyle='#fff';c.fillRect(x+w*0.205,y+h*0.2,w*0.01,h*0.28);c.fillRect(x+w*0.785,y+h*0.2,w*0.01,h*0.28);
  c.fillStyle='#9a6a4a';c.fillRect(x+w*0.72,y-s*0.24,w*0.1,s*0.14);
}
function drawRim(c,cx,cy,s,col){
  const R=s*0.44;
  c.fillStyle='#1d1f23';c.beginPath();c.arc(cx,cy,R,0,7);c.fill();
  c.fillStyle='#c9d1da';c.beginPath();c.arc(cx,cy,R*0.72,0,7);c.fill();
  c.fillStyle='#8f99a4';for(let i=0;i<10;i++){c.save();c.translate(cx,cy);c.rotate(i*Math.PI/5);c.beginPath();c.moveTo(-R*0.06,0);c.lineTo(-R*0.1,-R*0.66);c.lineTo(R*0.1,-R*0.66);c.lineTo(R*0.06,0);c.fill();c.restore();}
  c.fillStyle=col;c.beginPath();c.arc(cx,cy,R*0.16,0,7);c.fill();
}
function drawBike(c,cx,cy,s,col){
  const R=s*0.17;
  for(const dx of[-0.3,0.3]){c.strokeStyle='#1d1f23';c.lineWidth=R*0.35;c.beginPath();c.arc(cx+dx*s,cy+s*0.12,R,0,7);c.stroke();c.fillStyle='#9aa3ad';c.beginPath();c.arc(cx+dx*s,cy+s*0.12,R*0.3,0,7);c.fill();}
  c.fillStyle=col;c.beginPath();c.moveTo(cx-s*0.22,cy-s*0.02);c.lineTo(cx+s*0.12,cy-s*0.08);c.lineTo(cx+s*0.2,cy+s*0.08);c.lineTo(cx-s*0.1,cy+s*0.12);c.fill();
  c.fillStyle='#2b2f35';c.fillRect(cx-s*0.2,cy-s*0.1,s*0.18,s*0.05);
  c.strokeStyle='#5d6670';c.lineWidth=s*0.025;c.beginPath();c.moveTo(cx+s*0.3,cy+s*0.12);c.lineTo(cx+s*0.18,cy-s*0.16);c.lineTo(cx+s*0.1,cy-s*0.18);c.stroke();
  c.fillStyle='#fff6c0';c.beginPath();c.arc(cx+s*0.22,cy-s*0.1,s*0.03,0,7);c.fill();
}
build();
Arcade.panel({title:'Karcher',text:'Frotte l\'écran avec le doigt pour nettoyer toute la boue. Le jet apparaît juste au-dessus de ton doigt.',
  buttons:[{label:'Nettoyer',onClick:()=>{}},{label:'Menu',onClick:Arcade.toMenu}]});
Arcade.loop(frame);
</script>
</body>
</html>
