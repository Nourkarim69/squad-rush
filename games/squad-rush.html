<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<title>Squad Rush</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
<style>
:root{--fd:"Russo One","Arial Black",Impact,sans-serif}
#wrap{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bar) + var(--safe-top));display:grid;place-items:center;overflow:hidden;background:#07080a}
#c{display:block}
.ov2{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bar) + var(--safe-top));z-index:8;display:flex;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + var(--safe-bot));overflow-y:auto;touch-action:pan-y;
  background:linear-gradient(180deg,rgba(8,10,14,.15) 0%,rgba(8,10,14,.82) 45%,rgba(8,10,14,.94) 100%)}
.ov2[hidden]{display:none}
.card{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;margin:auto}
.kicker{font:13px/1 var(--fd);letter-spacing:.16em;text-transform:uppercase;color:#ffd27a}
.card h1{font:400 56px/.92 var(--fd);margin:0;color:#ffb020;text-shadow:0 4px 0 #7a4f00,0 12px 26px rgba(0,0,0,.7)}
.card h2{font:400 34px/1 var(--fd);margin:0;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.boss{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:#ffb4a8}
.boss b{font-family:var(--fd);font-weight:400;color:#ff5a4f;font-size:16px}
.play{font:400 24px var(--fd);border:0;border-radius:14px;padding:16px;background:linear-gradient(#ffc640,#ff9d00);color:#2a1700;
  box-shadow:0 5px 0 #9a5a00,0 10px 24px rgba(255,160,0,.25);cursor:pointer}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 #9a5a00}
.play:focus-visible,.up:focus-visible{outline:3px solid #fff;outline-offset:3px}
.shopH{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9aa3ad;font-weight:800}
.shopH span:last-child{font:400 18px var(--fd);letter-spacing:0;color:#ffd23f}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{font:inherit;text-align:left;border:0;border-radius:12px;padding:10px;background:rgba(39,46,56,.92);color:#f3f0e8;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.up b{font-size:14px}
.up span{font-size:11px;color:#9aa3ad;line-height:1.3}
.up em{font:400 15px var(--fd);font-style:normal;color:#ffd23f;margin-top:2px}
.up:disabled{opacity:.5;cursor:not-allowed}
.up.max em{color:#3ddc84}
.tip{margin:0;font-size:12px;color:#9aa3ad;line-height:1.45}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:rgba(39,46,56,.92);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:11px;color:#9aa3ad;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.stats b{font:400 20px var(--fd);font-variant-numeric:tabular-nums}
.gain{font:400 26px var(--fd);color:#ffd23f}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div class="ov2" id="hub">
  <div class="card">
    <div class="kicker" id="hubLvl">Niveau 1 · Désert</div>
    <h1>SQUAD<br>RUSH</h1>
    <div class="boss">Boss du niveau : <b id="hubBoss"></b></div>
    <button class="play" id="play">JOUER</button>
    <div class="shopH"><span>Améliorations</span><span id="hubCoins"></span></div>
    <div class="shop" id="shop"></div>
    <p class="tip">Glisse le doigt pour diriger l'escouade. Tire sur les portes pour faire monter leur valeur, et sur les caisses pour récupérer ce qu'elles contiennent.</p>
  </div>
</div>
<div class="ov2" id="res" hidden>
  <div class="card">
    <div class="kicker" id="resK"></div>
    <h2 id="resT"></h2>
    <div class="gain" id="resG"></div>
    <div class="stats" id="resS"></div>
    <button class="play" id="resB">CONTINUER</button>
  </div>
</div>

<script src="../shared/common.js"></script>
<script>
(()=>{
// =====================================================================
//  Helpers
// =====================================================================
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const FD='"Russo One","Arial Black",Impact,sans-serif';

Arcade.bar('Squad Rush');
let muted=Arcade.get('sr.mute',false);
const muteBtn=Arcade.barButton(muted?'🔇':'🔊',()=>{muted=!muted;Arcade.set('sr.mute',muted);muteBtn.textContent=muted?'🔇':'🔊';},'Activer ou couper le son');

const save=Object.assign({level:1,best:1,upStart:0,upDmg:0,upRate:0,startW:0},Arcade.get('sr2',{}));
function persist(){Arcade.set('sr2',save);}

// =====================================================================
//  Audio (small synth, no files)
// =====================================================================
let AC=null,NB=null,lastShot=0,lastHit=0,lastCoin=0;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();const r=AC.sampleRate;NB=AC.createBuffer(1,r,r);const d=NB.getChannelData(0);for(let i=0;i<r;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();return AC;
}
function tone(f0,f1,dur,type,vol,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.03);}
function noise(dur,vol,freq){const a=ac();if(!a)return;const t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);}
function sfx(k){
  if(muted)return;const now=performance.now();
  switch(k){
    case 'shot':if(now-lastShot<85)return;lastShot=now;noise(0.045,0.04,2600);break;
    case 'hit':if(now-lastHit<60)return;lastHit=now;tone(320,140,0.05,'square',0.02);break;
    case 'coin':if(now-lastCoin<45)return;lastCoin=now;tone(1250,1900,0.07,'square',0.025);break;
    case 'boom':noise(0.55,0.32,650);tone(110,38,0.45,'sine',0.28);break;
    case 'good':tone(520,900,0.14,'triangle',0.12);tone(780,1300,0.16,'triangle',0.1,0.07);break;
    case 'bad':tone(420,140,0.32,'sawtooth',0.07);break;
    case 'pick':tone(760,1500,0.12,'square',0.05);tone(1100,2100,0.12,'square',0.045,0.07);break;
    case 'hurt':tone(170,60,0.18,'square',0.07);break;
    case 'warn':tone(880,880,0.09,'square',0.05);tone(880,880,0.09,'square',0.05,0.16);break;
    case 'slam':noise(0.4,0.3,300);tone(80,30,0.35,'sine',0.3);break;
    case 'laser':tone(1400,300,0.5,'sawtooth',0.04);break;
    case 'win':[523,659,784,1046].forEach((f,i)=>tone(f,f,0.2,'triangle',0.12,i*0.11));break;
    case 'lose':[392,311,233].forEach((f,i)=>tone(f,f*0.92,0.28,'sawtooth',0.07,i*0.17));break;
  }
}

// =====================================================================
//  Canvas & projection
// =====================================================================
const cv=$('c'),ctx=cv.getContext('2d');
const W=420;let H=740,SC=1,DPR=1,HOR=180,BASE=620;
const D=260,RW=182;
function resize(){
  const wr=$('wrap'),ww=wr.clientWidth,wh=wr.clientHeight;
  SC=Math.min(ww/W,wh/600);H=clamp(wh/SC,600,960);
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=W*SC+'px';cv.style.height=H*SC+'px';
  cv.width=Math.round(W*SC*DPR);cv.height=Math.round(H*SC*DPR);
  HOR=Math.round(H*0.25);BASE=Math.round(H*0.84);
  if(biome)buildBG();
}
function P(x,z){const k=D/(D+z);return{x:W/2+x*RW*k,y:HOR+(BASE-HOR)*k,k};}
function quad(x0,z0,x1,z1){const a=P(x0,z0),b=P(x1,z0),c=P(x1,z1),d=P(x0,z1);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill();}

// =====================================================================
//  Sprites (drawn once into small canvases)
// =====================================================================
function sprite(w,h,fn){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const g=c.getContext('2d');g.scale(2,2);fn(g,w,h);c.w=w;c.h=h;return c;}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function blit(img,x,y,s){const w=img.w*s,h=img.h*s;ctx.drawImage(img,x-w/2,y-h,w,h);}

function mkSoldier(f){return sprite(32,48,g=>{
  const cx=16,by=46,s=Math.sin(f/4*Math.PI*2),lL=Math.max(0,s)*3,rL=Math.max(0,-s)*3;
  g.fillStyle='#24344d';g.fillRect(cx-7,by-16-lL,5,14);g.fillRect(cx+2,by-16-rL,5,14);
  g.fillStyle='#141416';g.fillRect(cx-8,by-4-lL,7,4);g.fillRect(cx+1,by-4-rL,7,4);
  const tg=g.createLinearGradient(cx-10,0,cx+10,0);tg.addColorStop(0,'#2c6ed6');tg.addColorStop(1,'#1d4f9e');
  g.fillStyle=tg;rr(g,cx-9,by-32,18,18,4);g.fill();
  g.fillRect(cx-12,by-30+s*1.5,4,11);g.fillRect(cx+8,by-30-s*1.5,4,11);
  g.fillStyle='#3b5f2c';rr(g,cx-6,by-31,12,12,3);g.fill();
  g.fillStyle='#2d4a21';g.fillRect(cx-6,by-23,12,2);g.fillRect(cx-1,by-31,2,12);
  g.fillStyle='#222429';g.fillRect(cx+7,by-45,3,17);g.fillStyle='#3b3f46';g.fillRect(cx+6,by-31,5,6);
  g.fillStyle='#e3b48a';g.beginPath();g.arc(cx,by-35,5.5,0,7);g.fill();
  g.fillStyle='#4a6b2f';g.beginPath();g.arc(cx,by-36,7.2,Math.PI,0);g.fill();g.fillRect(cx-7.8,by-36,15.6,3);
  g.fillStyle='rgba(255,255,255,.28)';g.fillRect(cx-4,by-41,5,2);
});}
function mkZombie(f,pal){return sprite(34,48,g=>{
  const cx=17,by=46,s=Math.sin(f/4*Math.PI*2),lL=Math.max(0,s)*3,rL=Math.max(0,-s)*3;
  g.fillStyle=pal.pants;g.fillRect(cx-7,by-16-lL,5,15);g.fillRect(cx+2,by-16-rL,5,15);
  g.fillStyle=pal.skin;g.fillRect(cx-7,by-3-lL,6,3);g.fillRect(cx+2,by-3-rL,6,3);
  g.fillStyle=pal.shirt;rr(g,cx-9,by-32,18,18,3);g.fill();
  g.fillStyle=pal.skin;g.beginPath();g.moveTo(cx-3,by-14);g.lineTo(cx+2,by-23);g.lineTo(cx+6,by-14);g.fill();
  g.fillStyle='rgba(120,0,0,.55)';g.fillRect(cx-6,by-27,4,3);
  g.fillStyle=pal.skin;g.fillRect(cx-13,by-38+s,4,14);g.fillRect(cx+9,by-38-s,4,14);
  g.fillStyle=pal.shirt;g.fillRect(cx-13,by-29+s,4,6);g.fillRect(cx+9,by-29-s,4,6);
  g.fillStyle=pal.skin;g.beginPath();g.arc(cx,by-37,7.2,0,7);g.fill();
  g.fillStyle=pal.eye;g.fillRect(cx-4.5,by-40,3.5,3);g.fillRect(cx+1,by-40,3.5,3);
  g.fillStyle='#2a0d0d';g.fillRect(cx-3,by-34,6,2.5);g.fillStyle='#e8e0c8';g.fillRect(cx-2,by-34,1.5,1.5);g.fillRect(cx+1,by-34,1.5,1.5);
  g.fillStyle=pal.hair;g.fillRect(cx-6,by-44.5,12,3);
});}
function mkBrute(f){return sprite(76,96,g=>{
  const cx=38,by=94,s=Math.sin(f/4*Math.PI*2);
  g.fillStyle='#3a2647';g.fillRect(cx-19,by-32-Math.max(0,s)*4,14,30);g.fillRect(cx+5,by-32-Math.max(0,-s)*4,14,30);
  g.fillStyle='#1e1424';g.fillRect(cx-21,by-6-Math.max(0,s)*4,18,6);g.fillRect(cx+3,by-6-Math.max(0,-s)*4,18,6);
  const sk=g.createLinearGradient(0,by-80,0,by-30);sk.addColorStop(0,'#8fb04e');sk.addColorStop(1,'#5d7a2e');
  g.fillStyle=sk;rr(g,cx-27,by-74,54,46,16);g.fill();
  g.fillStyle='#4a3020';g.fillRect(cx-25,by-36,50,7);g.fillStyle='#c9a227';g.fillRect(cx-5,by-37,10,9);
  g.fillStyle=sk;g.fillRect(cx-39,by-66+s*2,13,36);g.fillRect(cx+26,by-66-s*2,13,36);
  g.fillStyle='#8a9099';g.beginPath();g.ellipse(cx-27,by-70,13,9,0,0,7);g.fill();g.beginPath();g.ellipse(cx+27,by-70,13,9,0,0,7);g.fill();
  g.fillStyle='#c4c9cf';for(const sx of[-31,-23,23,31]){g.beginPath();g.moveTo(cx+sx-3,by-76);g.lineTo(cx+sx,by-86);g.lineTo(cx+sx+3,by-76);g.fill();}
  g.fillStyle='#6b4a2a';g.fillRect(cx+30,by-92-s*2,9,44);g.fillStyle='#9aa0a8';for(let i=0;i<4;i++)g.fillRect(cx+27,by-90+i*9-s*2,15,3);
  g.fillStyle='#7da044';g.beginPath();g.arc(cx,by-80,12,0,7);g.fill();
  g.fillStyle='#ff3b2f';g.fillRect(cx-7,by-84,5,4);g.fillRect(cx+2,by-84,5,4);
  g.fillStyle='#2a1010';g.fillRect(cx-6,by-75,12,4);g.fillStyle='#fff';g.fillRect(cx-5,by-77,2,3);g.fillRect(cx+3,by-77,2,3);
});}
function mkCrate(){return sprite(44,42,g=>{
  const gr=g.createLinearGradient(0,4,0,42);gr.addColorStop(0,'#c58a4a');gr.addColorStop(1,'#8a5a2b');
  g.fillStyle=gr;g.fillRect(2,4,40,38);g.strokeStyle='#5e3b1a';g.lineWidth=3;g.strokeRect(3.5,5.5,37,35);
  g.beginPath();g.moveTo(5,8);g.lineTo(39,38);g.moveTo(39,8);g.lineTo(5,38);g.stroke();
  g.fillStyle='#9aa3ad';for(const[x,y]of[[2,4],[36,4],[2,36],[36,36]])g.fillRect(x,y,6,6);
});}
function mkBarrel(){return sprite(28,38,g=>{
  const gr=g.createLinearGradient(2,0,26,0);gr.addColorStop(0,'#8e1b14');gr.addColorStop(.45,'#e8453c');gr.addColorStop(1,'#7a140e');
  g.fillStyle=gr;rr(g,2,2,24,35,5);g.fill();
  g.fillStyle='#5a0e0a';g.fillRect(2,10,24,3);g.fillRect(2,27,24,3);
  g.fillStyle='#ffd23f';g.beginPath();g.moveTo(14,13);g.lineTo(21,25);g.lineTo(7,25);g.closePath();g.fill();
  g.fillStyle='#1a1a1a';g.fillRect(13,16,2,5);g.fillRect(13,22,2,2);
});}
function mkCoin(){return sprite(18,18,g=>{
  const gr=g.createRadialGradient(7,6,1,9,9,9);gr.addColorStop(0,'#fff6b0');gr.addColorStop(.5,'#ffd23f');gr.addColorStop(1,'#c98a00');
  g.fillStyle=gr;g.beginPath();g.arc(9,9,8,0,7);g.fill();g.strokeStyle='#a86f00';g.lineWidth=1.5;g.beginPath();g.arc(9,9,5.5,0,7);g.stroke();
});}
const ITEM_COL={weapon:'#ffb020',recruits:'#2f8cff',rage:'#ff5a2f',shield:'#35c3ff',bomb:'#b36bff',coins:'#ffd23f'};
const ITEM_NAME={weapon:'ARME +',recruits:'RENFORTS',rage:'RAGE !',shield:'BOUCLIER',bomb:'BOMBE',coins:'TRÉSOR'};
function drawGun(g,x,y,s,col){
  g.fillStyle=col;g.fillRect(x-10*s,y-3*s,20*s,6*s);g.fillRect(x+6*s,y-2*s,8*s,3*s);
  g.fillStyle='#1a1a1a';g.fillRect(x-8*s,y+2*s,5*s,8*s);g.fillRect(x-1*s,y+2*s,3*s,4*s);
}
function mkIcon(type){return sprite(48,48,g=>{
  const c=ITEM_COL[type],gr=g.createRadialGradient(24,24,2,24,24,24);gr.addColorStop(0,c);gr.addColorStop(.55,c+'99');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,48,48);
  g.fillStyle='rgba(15,18,24,.85)';g.beginPath();g.arc(24,24,15,0,7);g.fill();g.strokeStyle=c;g.lineWidth=2.5;g.stroke();
  g.fillStyle='#fff';
  switch(type){
    case 'weapon':drawGun(g,24,22,0.95,'#fff');break;
    case 'recruits':g.beginPath();g.arc(21,19,5,0,7);g.fill();rr(g,14,25,14,9,4);g.fill();g.fillRect(29,22,8,3);g.fillRect(31.5,19.5,3,8);break;
    case 'rage':g.fillStyle='#ffd23f';g.beginPath();g.moveTo(27,11);g.lineTo(17,26);g.lineTo(23,26);g.lineTo(20,37);g.lineTo(31,21);g.lineTo(25,21);g.closePath();g.fill();break;
    case 'shield':g.fillStyle='#bfefff';g.beginPath();g.moveTo(24,12);g.lineTo(34,16);g.quadraticCurveTo(33,31,24,37);g.quadraticCurveTo(15,31,14,16);g.closePath();g.fill();break;
    case 'bomb':g.fillStyle='#111';g.beginPath();g.arc(23,27,9,0,7);g.fill();g.fillStyle='#fff';g.fillRect(25,14,3,6);g.fillStyle='#ffb020';g.beginPath();g.arc(27,13,3,0,7);g.fill();break;
    case 'coins':g.fillStyle='#ffd23f';g.beginPath();g.ellipse(24,29,9,4,0,0,7);g.fill();g.fillRect(15,22,18,7);g.beginPath();g.ellipse(24,22,9,4,0,0,7);g.fillStyle='#fff1a0';g.fill();break;
  }
});}
// ---- decor ----
function mkDeco(kind,v){
  switch(kind){
    case 'cactus':return sprite(44,72,g=>{g.fillStyle='#3f7a3a';rr(g,17,8,10,64,5);g.fill();rr(g,5,24,7,22,3);g.fill();g.fillRect(5,40,14,6);rr(g,32,16,7,24,3);g.fill();g.fillRect(25,34,14,6);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(19,12,2,56);});
    case 'rock':return sprite(56,30,g=>{g.fillStyle='#a8743f';g.beginPath();g.moveTo(2,30);g.lineTo(10,10);g.lineTo(26,3);g.lineTo(44,9);g.lineTo(54,30);g.fill();g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.moveTo(30,30);g.lineTo(44,9);g.lineTo(54,30);g.fill();});
    case 'skull':return sprite(46,26,g=>{g.fillStyle='#efe6d2';g.beginPath();g.ellipse(14,14,10,9,0,0,7);g.fill();g.fillRect(24,16,20,4);g.fillRect(30,12,3,12);g.fillStyle='#3b2a1a';g.fillRect(9,11,4,4);g.fillRect(16,11,4,4);});
    case 'building':return sprite(80,190,g=>{
      const h=110+v*12,top=190-h,col=['#1f1636','#241a40','#1a1830'][v%3];
      g.fillStyle=col;g.fillRect(4,top,72,h);g.fillStyle='rgba(255,255,255,.05)';g.fillRect(4,top,8,h);
      for(let y=top+10;y<186;y+=14)for(let x=12;x<70;x+=12){if(Math.random()<.55){g.fillStyle=Math.random()<.5?'#ffd27a':'#7ff3ff';g.globalAlpha=rnd(.35,.95);g.fillRect(x,y,6,7);g.globalAlpha=1;}}
      g.fillStyle=['#ff3ea5','#3ef0ff','#b36bff'][v%3];g.fillRect(4,top-3,72,3);});

function makeDeco(z){
  const side=Math.random()<.5?-1:1,k=pick(biome.deco);
  return{z,x:side*(k==='building'?rnd(1.3,1.9):rnd(1.25,2.8)),k,v:Math.floor(Math.random()*6),s:rnd(.85,1.2),side};
}
function gateOption(good,f){
  const sc=1+f*1.3;
  if(good){
    const r=Math.random();
    if(r<0.45)return{op:'+',v:Math.round(ri(4,7+L*2)*sc)};
    if(r<0.75)return{op:'x',v:Math.random()<.18?3:2};
    if(r<0.88&&wIdx<4)return{op:'W',v:1};
    return{op:'R',v:6};
  }
  const r=Math.random();
  if(r<0.45)return{op:'+',v:-Math.round(ri(4,8+L*3)*sc)};
  if(r<0.7)return{op:'/',v:2};
  if(r<0.85)return{op:'+',v:-Math.round(ri(2,5+L)*sc)};
  return{op:'+',v:Math.round(ri(2,4+L)*sc)};
}
let uid=0;
function horde(z,f,kind,x){
  const base=3+L*3;
  if(kind==='brute'){const hp=Math.round((35+L*22)*(1+f*0.8));return{type:'horde',kind,z,x:x??0,hp,max:hp,unit:hp,vz:20,steer:0.18,w:0.2,id:uid++,seed:Math.random()*9};}
  if(kind==='runner'){const hp=Math.max(2,Math.round(base*0.55*rnd(0.7,1.2)*(1+f)));return{type:'horde',kind,z,x:x??rnd(-0.6,0.6),hp,max:hp,unit:2,vz:95,steer:0.45,w:0.1,id:uid++,seed:Math.random()*9,pal:0};}
  const hp=Math.max(3,Math.round(base*rnd(0.7,1.3)*(1+1.5*f)));
  return{type:'horde',kind:'zombie',z,x:x??rnd(-0.55,0.55),hp,max:hp,unit:3,vz:rnd(22,42),steer:0.3,w:0.1,id:uid++,seed:Math.random()*9,pal:ri(0,2)};
}
function genLevel(){
  L=save.level;biome=BIOMES[(L-1)%4];bossDef=BOSSES[(L-1)%4];
  wIdx=save.startW;ents=[];zones=[];boss=null;bullets=[];parts=[];floats=[];muzzle=[];
  levelLen=Math.min(3000+L*260,6800);
  let z=560,i=0,mini=false;
  const table=[['gates',30],['horde',26],['crate',11],['barrels',7],['coins',7],['saw',L>=2?7:0],['wall',L>=3?6:0],['runners',L>=2?8:0]];
  const tot=table.reduce((a,b)=>a+b[1],0);
  while(z<levelLen){
    const f=z/levelLen;let kind;
    if(i<2)kind='gates';
    else if(!mini&&f>0.52){kind='mini';mini=true;}
    else{let r=Math.random()*tot;for(const[k,w]of table){r-=w;if(r<=0){kind=k;break;}}}
    switch(kind){
      case 'gates':{const a=gateOption(true,f),b=gateOption(i<2||Math.random()<.25,f);ents.push({type:'gate',z,opts:Math.random()<.5?[a,b]:[b,a],charge:[0,0],pulse:[0,0],used:false});break;}
      case 'horde':ents.push(horde(z,f,'zombie'));if(Math.random()<0.35+L*0.03)ents.push(horde(z+40,f,'zombie'));break;
      case 'runners':for(let k=0;k<ri(2,3);k++)ents.push(horde(z+k*25,f,'runner'));break;
      case 'mini':ents.push(horde(z,f,'brute'));break;
      case 'crate':{const items=['weapon','recruits','recruits','rage','shield','bomb','coins'].filter(it=>it!=='weapon'||wIdx<4);
        const hp=Math.round(5+L*2.5+f*12);ents.push({type:'crate',z,x:rnd(-0.6,0.6),hp,max:hp,item:pick(items)});
        if(Math.random()<0.5)ents.push(horde(z+70,f,'zombie'));break;}
      case 'barrels':{const cx=rnd(-0.5,0.5);for(let k=-1;k<=1;k++)ents.push({type:'barrel',z:z+Math.abs(k)*12,x:clamp(cx+k*0.17,-0.85,0.85),hp:2});ents.push(horde(z+70,f,'zombie',cx));break;}
      case 'coins':{const cx=rnd(-0.6,0.6),cur=rnd(-0.3,0.3);for(let k=0;k<8;k++)ents.push({type:'coin',z:z+k*28,x:clamp(cx+Math.sin(k*0.5)*cur,-0.85,0.85)});break;}
      case 'saw':ents.push({type:'saw',z,x:rnd(-0.7,0.7),dir:Math.random()<.5?1:-1,spd:rnd(0.5,0.9)+L*0.02,rot:0});break;
      case 'wall':{const hp=Math.round(12+L*5+f*15);ents.push({type:'wall',z,x:pick([-0.55,0,0.55]),w:0.3,hp,max:hp});break;}
    }
    if(Math.random()<0.22&&kind!=='coins'){const cx=rnd(-0.6,0.6);for(let k=0;k<5;k++)ents.push({type:'coin',z:z+150+k*26,x:cx});}
    z+=rnd(270,360);i++;
  }
  ents.sort((a,b)=>a.z-b.z);
  decor=[];for(let k=0;k<36;k++)decor.push(makeDeco(k*85+rnd(0,50)));
  amb=[];for(let k=0;k<45;k++)amb.push({x:rnd(0,W),y:rnd(0,H),v:rnd(0.5,1),s:rnd(1,2.6)});
  buildBG();
}

function spark(x,y,col,count,spd=160,life=0.35){for(let i=0;i<count;i++){const a=rnd(0,6.28),s=rnd(.3,1)*spd;parts.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,col});}}
function debris(x,y,col,count,spd=200){for(let i=0;i<count;i++){const a=rnd(Math.PI*1.05,Math.PI*1.95),s=rnd(.4,1)*spd;parts.push({k:'deb',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.5,.9),max:.9,col,r:rnd(2,4.5),rot:rnd(0,6)});}}
function smoke(x,y,count,size=14){for(let i=0;i<count;i++)parts.push({k:'smoke',x:x+rnd(-10,10),y:y+rnd(-8,8),vx:rnd(-20,20),vy:rnd(-50,-15),life:rnd(.6,1.1),max:1.1,r:size*rnd(.6,1.2)});}
function ring(x,y,r,col){parts.push({k:'ring',x,y,r0:r*0.2,r,life:.4,max:.4,col});}
function fireball(x,y,size){parts.push({k:'fire',x,y,r:size,life:.35,max:.35});spark(x,y,'#ffd27a',14,260,.45);smoke(x,y,6,size*0.6);ring(x,y,size*2.2,'255,200,120');}
function floatTxt(x,y,txt,col,size=30){floats.push({x,y,txt,col,size,life:1.1});}
function lossSoldiers(k){
  if(k<=0)return;n=Math.max(0,n-k);nPulse=1;shake=Math.max(shake,0.18);sfx('hurt');Arcade.vibrate(25);
  const p=P(sx,0);floatTxt(p.x,p.y-110,'−'+k,'#ff6b5f',30);debris(p.x,p.y-20,'#2c6ed6',Math.min(30,k+4),220);spark(p.x,p.y-20,'#ff4d3d',Math.min(20,k+3),180);
}
function gainCoin(x,z,v){
  coinsRun+=v;const p=P(x,z);
  for(let i=0;i<Math.min(v,6);i++)parts.push({k:'fly',x:p.x+rnd(-8,8),y:p.y-20+rnd(-8,8),t:-i*0.05,life:1,max:1,sx:p.x,sy:p.y-20});
  sfx('coin');
}
function killEnt(e){
  e.dead=true;kills+=e.kind==='brute'?10:Math.ceil(e.max/e.unit);
  const p=P(e.x,e.z);
  debris(p.x,p.y-20*p.k,e.kind==='runner'?'#c97b6b':'#7fae5a',e.kind==='brute'?30:14,240);
  spark(p.x,p.y-20*p.k,'#b6ff7a',10,200);
  if(e.kind==='brute'){fireball(p.x,p.y-40*p.k,40*p.k);sfx('boom');shake=Math.max(shake,0.3);}
  gainCoin(e.x,e.z,Math.max(1,Math.ceil(e.max/(e.kind==='brute'?4:6))));
}
function explode(x,z,contact){
  const p=P(x,z);fireball(p.x,p.y-14*p.k,55*p.k+18);debris(p.x,p.y-10,'#5a0e0a',14,300);
  sfx('boom');shake=Math.max(shake,0.35);Arcade.vibrate(40);
  const dmg=25+L*6;
  for(const e of ents){
    if(e.dead||e.z<-40)continue;
    if(Math.abs(e.x-x)<0.38&&Math.abs(e.z-z)<120){
      if(e.type==='horde'||e.type==='crate'||e.type==='wall')damageEnt(e,dmg);
      else if(e.type==='barrel'&&!e.boom&&e.chain==null)e.chain=0.12;
    }
  }
  if(contact&&shield<=0)lossSoldiers(Math.min(n,6));
}
function damageEnt(e,d){
  if(e.dead)return;e.hp-=d;e.hit=0.07;
  if(e.hp>0)return;
  if(e.type==='horde')killEnt(e);
  else if(e.type==='crate'){
    const p=P(e.x,e.z);debris(p.x,p.y-20*p.k,'#a0703f',16,220);spark(p.x,p.y-20*p.k,ITEM_COL[e.item],12,180);
    e.type='pickup';e.bob=0;sfx('pick');
  }else if(e.type==='wall'){const p=P(e.x,e.z);debris(p.x,p.y-20*p.k,'#8f969e',24,260);smoke(p.x,p.y-10,6,16);e.dead=true;sfx('boom');}
  else if(e.type==='barrel'&&!e.boom){e.boom=true;e.dead=true;explode(e.x,e.z,false);}
}
function applyGate(g){
  const side=sx<0?0:1,o=g.opts[side],before=n,p=P(side?0.5:-0.5,0);
  let txt,good=true;
  if(o.op==='+'){n+=o.v;good=o.v>=0;}
  else if(o.op==='x')n*=o.v;
  else if(o.op==='/'){n=Math.ceil(n/o.v);good=false;}
  else if(o.op==='W'){upgradeWeapon();}
  else if(o.op==='R'){rage=Math.max(rage,o.v);txt='RAGE !';}
  n=Math.max(0,Math.floor(n));nMax=Math.max(nMax,n);
  if(o.op==='+'||o.op==='x'||o.op==='/'){const d=n-before;txt=(d>=0?'+':'−')+Math.abs(d);}
  if(txt)floatTxt(P(sx,0).x,BASE-120,txt,good?'#7fd0ff':'#ff6b5f',38);
  flash={col:good?'47,140,255':'232,69,60',t:0.25};nPulse=1;
  for(let i=0;i<26;i++)parts.push({k:'shard',x:p.x+rnd(-80,80),y:p.y-rnd(20,120),vx:rnd(-160,160),vy:rnd(-220,-40),life:rnd(.5,.9),max:.9,col:good?'150,200,255':'255,140,130',r:rnd(3,7),rot:rnd(0,6)});
  sfx(good?'good':'bad');Arcade.vibrate(good?15:50);
}
function upgradeWeapon(){
  if(wIdx<4){wIdx++;banner={txt:WEAPONS[wIdx].name.toUpperCase(),sub:'Nouvelle arme',t:1.4};}
  else{rage=Math.max(rage,6);floatTxt(P(sx,0).x,BASE-150,'RAGE !','#ff8a4a',30);}
}
function applyItem(it){
  const p=P(sx,0);sfx('pick');Arcade.vibrate(15);spark(p.x,p.y-40,ITEM_COL[it],20,220);
  switch(it){
    case 'weapon':upgradeWeapon();break;
    case 'recruits':{const k=5+L*2;n+=k;nMax=Math.max(nMax,n);nPulse=1;floatTxt(p.x,BASE-130,'+'+k+' RENFORTS','#7fd0ff',26);break;}
    case 'rage':rage=7;floatTxt(p.x,BASE-130,'RAGE ! TIR x2','#ff8a4a',26);break;
    case 'shield':shield=6;floatTxt(p.x,BASE-130,'BOUCLIER','#7fe6ff',26);break;
    case 'bomb':flash={col:'255,255,255',t:0.4};shake=0.5;sfx('boom');
      for(const e of ents){if(!e.dead&&e.z>0&&e.z<850&&(e.type==='horde'||e.type==='wall'||e.type==='crate'))damageEnt(e,40+L*14);}
      if(boss&&boss.state!=='dead')damageBoss(boss.max*0.08);
      floatTxt(p.x,BASE-130,'BOMBE !','#d6a8ff',30);break;
    case 'coins':gainCoin(sx,0,15+L*4);floatTxt(p.x,BASE-130,'TRÉSOR !','#ffd23f',26);break;
  }
}
function killZone(test){
  const vis=Math.min(n,MAXV);if(!vis)return 0;let c=0;
  for(let i=0;i<vis;i++)if(test(sx+FORM[i].x,FORM[i].z/95))c++;
  return c?Math.max(1,Math.round(n*c/vis)):0;
}

function spawnBoss(){
  const hp=Math.round(520+L*430);
  boss={def:bossDef,z:1500,x:0,hp,max:hp,state:'approach',atkT:2.2,anim:0,hit:0,enraged:false,act:0,crush:0,aim:0};
  banner={txt:bossDef.name.toUpperCase(),sub:'BOSS',t:2.4,boss:true};sfx('warn');
}
function damageBoss(d){
  const b=boss;if(!b||b.state==='dead'||(b.state==='approach'&&b.z>1100))return;
  b.hp-=d;b.hit=1;
  if(b.hp<=0){b.hp=0;b.state='dead';b.deadT=1.8;zones=[];sfx('boom');shake=0.6;Arcade.vibrate([60,40,60]);}
}
function updateBoss(dt){
  const b=boss;if(!b)return;
  b.anim+=dt;b.hit=Math.max(0,b.hit-dt*7);b.act=Math.max(0,b.act-dt);
  if(b.state==='dead'){
    b.deadT-=dt;
    if(Math.random()<dt*14){const p=P(b.x+rnd(-b.def.w,b.def.w),b.z);fireball(p.x,p.y-rnd(30,220)*p.k,rnd(25,55)*p.k+10);if(Math.random()<.4)sfx('boom');}
    if(b.deadT<=0){const p=P(b.x,b.z);for(let i=0;i<5;i++)fireball(p.x+rnd(-80,80)*p.k,p.y-rnd(40,200)*p.k,70*p.k);gainCoin(b.x,b.z,20+L*5);boss=null;flash={col:'255,240,200',t:0.6};finish(true);}
    return;
  }
  if(mode!=='play')return;
  if(b.state==='approach'){b.z-=150*dt;if(b.z<=330)b.state='fight';}
  else{
    if(b.z>75)b.z-=(b.enraged?15:10)*dt;
    else{b.crush+=(10+L*3)*dt;let k=0;while(b.crush>=1){b.crush--;k++;}if(k&&shield<=0){n=Math.max(0,n-k);const p=P(sx,0);debris(p.x,p.y-20,'#2c6ed6',k*2,200);nPulse=1;}
      if(Math.floor(b.anim*1.5)!==Math.floor((b.anim-dt)*1.5)){shake=0.3;sfx('slam');}}
    b.atkT-=dt;
    if(b.atkT<=0){b.def.attack(b);b.atkT=b.enraged?1.9:2.9;b.act=0.7;}
    if(!b.enraged&&b.hp<b.max*0.5){b.enraged=true;banner={txt:'IL ENRAGE !',sub:b.def.name,t:1.4,boss:true};sfx('warn');}
  }
  b.x+=(clamp(sx*0.35,-0.3,0.3)-b.x)*dt*0.6;
  b.aim+=(sx-b.aim)*dt*3;
}
function atkSlam(b){
  const left=sx<0;
  zones.push({kind:'band',x0:left?-1.05:-0.08,x1:left?0.08:1.05,warn:1.1,t:0,life:0.35});
  if(b.enraged){zones.push({kind:'band',x0:left?-0.08:-1.05,x1:left?1.05:0.08,warn:2.1,t:0,life:0.35});
    for(let k=0;k<2;k++)ents.push(horde(b.z-30,0.6,'runner',rnd(-0.5,0.5)));}
}
function atkShells(b){const k=b.enraged?4:3;for(let i=0;i<k;i++)zones.push({kind:'circle',x:clamp(sx+rnd(-0.28,0.28),-0.88,0.88),r:0.17,warn:1.0+i*0.3,t:0,life:0.3,proj:'shell'});}
function atkBeam(b){const dir=sx<0?1:-1;zones.push({kind:'beam',x:dir>0?-1.15:1.15,dir,warn:0.8,t:0,dur:b.enraged?1.1:1.6,acc:0});sfx('laser');}
function atkRocks(b){const k=b.enraged?7:5;for(let i=0;i<k;i++)zones.push({kind:'circle',x:i===0?sx:rnd(-0.88,0.88),r:0.14,warn:1.05+Math.random()*0.7,t:0,life:0.3,proj:'rock'});
  if(b.enraged)ents.push(horde(b.z-30,0.6,'runner',rnd(-0.5,0.5)));}
function updateZones(dt){
  for(const z of zones){
    z.t+=dt;
    if(z.kind==='beam'){
      if(z.t>z.warn){
        z.x+=z.dir*(2.3/z.dur)*dt;
        if(shield<=0&&n>0){const vis=Math.min(n,MAXV);let c=0;for(let i=0;i<vis;i++)if(Math.abs(sx+FORM[i].x-z.x)<0.075)c++;
          if(c){z.acc+=n*(c/vis)*dt*5;let k=0;while(z.acc>=1){z.acc--;k++;}if(k){n=Math.max(0,n-k);const p=P(z.x,0);spark(p.x,p.y-20,'#ff5a4f',6,160);nPulse=1;}}}
        if(Math.abs(z.x)>1.2&&z.t>z.warn+0.2)z.dead=true;
      }
      continue;
    }
    if(!z.fired&&z.t>=z.warn){
      z.fired=true;
      let k=0;
      if(z.kind==='band'){k=killZone(mx=>mx>=z.x0&&mx<=z.x1);const p=P((z.x0+z.x1)/2,0);ring(p.x,p.y,180,'255,120,80');for(let i=0;i<8;i++)smoke(P(rnd(z.x0,z.x1),rnd(-20,40)).x,p.y-10,1,22);debris(p.x,p.y,'#8a7a6a',20,300);shake=0.45;sfx('slam');}
      else{k=killZone((mx,mz)=>(mx-z.x)**2+mz*mz<z.r*z.r);const p=P(z.x,0);fireball(p.x,p.y-10,z.proj==='rock'?38:46);if(z.proj==='rock')debris(p.x,p.y-10,'#3a2a24',14,260);shake=Math.max(shake,0.3);sfx('boom');}
      if(k>0&&shield<=0)lossSoldiers(k);
    }
    if(z.t>z.warn+z.life)z.dead=true;
  }
  zones=zones.filter(z=>!z.dead);
}

// =====================================================================
//  Update
// =====================================================================
function update(dt){
  t+=dt;
  if(keys.l)sx-=1.9*dt;if(keys.r)sx+=1.9*dt;
  const vis=Math.min(n,MAXV);rad=0.034*Math.sqrt(vis)+0.05;
  sx=clamp(sx,-0.95+rad,0.95-rad);
  rage=Math.max(0,rage-dt);shield=Math.max(0,shield-dt);nPulse=Math.max(0,nPulse-dt*4);
  const target=boss||mode!=='play'?0:250;
  speed+=(target-speed)*Math.min(1,dt*(boss?1.4:2.2));
  const dz=speed*dt;dist+=dz;
  for(const e of ents)e.z-=dz;
  for(const d of decor){d.z-=dz;if(d.z<-170)Object.assign(d,makeDeco(d.z+36*85));}
  if(!boss&&dist>=levelLen&&mode==='play')spawnBoss();
  updateEnts(dt);
  updateBoss(dt);
  if(mode==='play')updateZones(dt);
  if(mode==='play')fire(dt);
  updateBullets(dt,dz);
  if(mode==='play'&&n<=0){n=0;finish(false);}
}
function updateEnts(dt){
  for(const e of ents){
    if(e.dead)continue;
    e.hit=Math.max(0,(e.hit||0)-dt);
    switch(e.type){
      case 'gate':
        e.pulse[0]=Math.max(0,e.pulse[0]-dt*4);e.pulse[1]=Math.max(0,e.pulse[1]-dt*4);
        if(!e.used&&e.z<=0&&mode==='play'){e.used=true;applyGate(e);}
        if(e.z<-220)e.dead=true;break;
      case 'horde':{
        e.z-=e.vz*dt;
        if(e.kind!=='brute'){const u=Math.min(Math.ceil(e.hp/e.unit),40);e.w=0.034*Math.sqrt(u)+0.06;}
        if(e.z<750)e.x+=clamp(sx-e.x,-e.steer*dt,e.steer*dt);
        if(mode==='play'&&e.z<=18&&e.z>-40&&Math.abs(e.x-sx)<e.w+rad*0.8){
          if(shield>0){killEnt(e);}
          else{const loss=Math.min(n,Math.ceil(e.hp));lossSoldiers(loss);e.hp-=loss;if(e.hp<=0.001)killEnt(e);}
        }
        if(e.z<-90)e.dead=true;break;}
      case 'barrel':
        if(e.chain!=null){e.chain-=dt;if(e.chain<=0&&!e.boom){e.boom=true;e.dead=true;explode(e.x,e.z,false);}break;}
      // fallthrough
      case 'crate':case 'wall':{
        const hw=e.type==='wall'?e.w:e.type==='crate'?0.12:0.08;
        if(mode==='play'&&e.z<=14&&e.z>-30&&Math.abs(e.x-sx)<hw+rad*0.8){
          if(e.type==='barrel'){e.boom=true;e.dead=true;explode(e.x,e.z,true);}
          else{const loss=shield>0?0:Math.min(n,Math.ceil(e.type==='crate'?e.hp/2:e.hp));lossSoldiers(loss);e.dead=true;
            const p=P(e.x,e.z);debris(p.x,p.y-20,e.type==='crate'?'#a0703f':'#8f969e',20,240);}
        }
        if(e.z<-90)e.dead=true;break;}
      case 'pickup':
        e.bob+=dt;
        if(mode==='play'&&e.z<=14&&e.z>-30&&Math.abs(e.x-sx)<rad+0.1){applyItem(e.item);e.dead=true;}
        if(e.z<-90)e.dead=true;break;
      case 'coin':
        if(mode==='play'&&e.z<=12&&e.z>-25&&Math.abs(e.x-sx)<rad+0.06){e.dead=true;gainCoin(e.x,e.z,1);}
        if(e.z<-60)e.dead=true;break;
      case 'saw':
        e.x+=e.dir*e.spd*dt;if(e.x>0.86){e.x=0.86;e.dir=-1;}if(e.x<-0.86){e.x=-0.86;e.dir=1;}e.rot+=dt*16;
        if(!e.done&&e.z<=4&&mode==='play'){e.done=true;if(shield<=0){const k=killZone(mx=>Math.abs(mx-e.x)<0.1);if(k){lossSoldiers(k);const p=P(e.x,0);spark(p.x,p.y-20,'#ffe9a0',20,260);}}}
        if(e.z<-90)e.dead=true;break;
    }
  }
  ents=ents.filter(e=>!e.dead);
}
function fire(dt){
  if(n<=0)return;
  const w=WEAPONS[wIdx],rate=w.rate*(1+save.upRate*0.1)*(rage>0?2:1);
  const sps=n*rate,vps=Math.min(sps,w.pel>1?22:w.aoe?18:46);
  const dmg=w.dmg*(1+save.upDmg*0.15)*sps/vps;
  fireAcc+=vps*dt;
  const vis=Math.min(n,MAXV);
  while(fireAcc>=1){
    fireAcc--;
    const f=FORM[Math.floor(Math.random()*vis)];
    for(let p=0;p<w.pel;p++){
      const sp=w.pel>1?(p-(w.pel-1)/2)*w.spread+rnd(-.01,.01):rnd(-w.spread,w.spread);
      bullets.push({x:sx+f.x+0.02,z:f.z+10,vx:sp,dmg,pierce:w.pierce||1,aoe:w.aoe||0,wi:wIdx,hits:null});
    }
    if(muzzle.length<14)muzzle.push({x:sx+f.x+0.02,z:f.z+10,t:0.05});
    sfx('shot');
  }
}
function updateBullets(dt,dz){
  const BV=1150;
  const targets=ents.filter(e=>e.z>-5&&((e.type==='gate'&&!e.used)||e.type==='horde'||e.type==='crate'||e.type==='barrel'||e.type==='wall'));
  targets.sort((a,b)=>a.z-b.z);
  for(const b of bullets){
    const prev=b.z;b.z+=BV*dt;b.x+=b.vx*dt*3;
    if(b.z>1100||Math.abs(b.x)>1.4){b.dead=true;continue;}
    for(const e of targets){
      if(e.dead)continue;
      if(e.z>b.z)break;
      const moved=dz+(e.vz||0)*dt+2;
      if(prev>e.z+moved)continue;
      if(b.hits&&b.hits.includes(e))continue;
      let hw=null;
      switch(e.type){
        case 'gate':
          if(Math.abs(b.x)>0.03&&Math.abs(b.x)<1){
            const s=b.x<0?0:1,o=e.opts[s];
            if(o.op==='+'){e.charge[s]+=b.dmg;while(e.charge[s]>=3&&o.v<199){e.charge[s]-=3;o.v++;}e.pulse[s]=1;}
            b.dead=true;
          }
          break;
        case 'horde':hw=e.w;break;
        case 'crate':hw=0.12;break;
        case 'barrel':hw=0.09;break;
        case 'wall':hw=e.w;break;
      }
      if(b.dead)break;
      if(hw!=null&&Math.abs(b.x-e.x)<hw){
        const p=P(b.x,e.z);
        if(Math.random()<.35)spark(p.x,p.y-26*p.k,WEAPONS[b.wi].col,2,120,.2);
        if(b.aoe){fireball(p.x,p.y-20*p.k,26*p.k+6);for(const o of targets){if(!o.dead&&o!==e&&o.type!=='gate'&&Math.abs(o.x-b.x)<b.aoe&&Math.abs(o.z-e.z)<70)damageEnt(o,b.dmg*0.6);}}
        damageEnt(e,b.dmg);sfx('hit');
        if(e.type==='wall'||e.type==='crate'||e.type==='barrel'){b.dead=true;break;}
        b.pierce--;if(b.pierce<=0){b.dead=true;break;}
        (b.hits||(b.hits=[])).push(e);
      }
    }
    if(!b.dead&&boss&&boss.state!=='dead'&&b.z>=boss.z-10&&Math.abs(b.x-boss.x)<boss.def.w){
      damageBoss(b.dmg);b.dead=true;
      if(Math.random()<.3||b.aoe){const p=P(b.x,boss.z);const y=p.y-rnd(40,200)*p.k;if(b.aoe)fireball(p.x,y,30*p.k+8);else spark(p.x,y,'#ffd27a',3,150,.25);}
    }
  }
  bullets=bullets.filter(b=>!b.dead);
}
const HUDC={x:W-46,y:30};
function updateParts(dt){
  for(const p of parts){
    p.life-=dt;
    if(p.k==='fly'){p.t+=dt;if(p.t<0){p.life+=dt;continue;}const k=Math.min(1,p.t/0.55);const e=k*k;p.x=p.sx+(HUDC.x-p.sx)*e-Math.sin(k*3.14)*40;p.y=p.sy+(HUDC.y-p.sy)*e-Math.sin(k*3.14)*60;if(k>=1)p.life=0;continue;}
    p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;
    if(p.k==='deb'||p.k==='shard'){p.vy+=700*dt;p.rot+=dt*8;}

function drawAmbient(){

function drawTank(b,p,s){
  const rec=b.act>0?Math.sin((0.7-b.act)/0.7*Math.PI)*14*s:0;

  ctx.fillStyle='#ffb020';for(const dx of[-50,-30,30,50]){ctx.beginPath();ctx.arc(p.x+dx*s,by-28*s,5*s,0,7);ctx.fill();}

function drawGolem(b,p,s){
  const raise=b.act>0?Math.sin((0.7-b.act)/0.7*Math.PI):0,step=Math.sin(b.anim*2.5)*6;
  ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(p.x,p.y,130*s,26*s,0,0,7);ctx.fill();

function drawBoss(){
  if(!boss)return;const b=boss,p=P(b.x,b.z);if(p.y<HOR-4)return;
  const s=p.k*1.45,fade=fadeFor(b.z);ctx.globalAlpha=fade;
  if(b.state==='dead'&&Math.sin(t*40)>0)ctx.globalAlpha=fade*0.6;
  b.def.draw(b,p,s);
  ctx.globalAlpha=1;
}
const DRAW={gate:drawGate,horde:drawHorde,crate:drawCrate,pickup:drawPickup,wall:drawWall,saw:drawSaw,barrel:drawBarrel,coin:drawCoin};
function draw(){
  ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-1,1)*shake*18,rnd(-1,1)*shake*18);
  drawWorld();
  for(const z of zones)drawZone(z);
  const items=[];
  for(const d of decor)if(d.z>-160&&d.z<2800)items.push([d.z,drawDeco,d]);
  for(const e of ents){if(e.z>2800||e.z<-200)continue;items.push([e.z,DRAW[e.type],e]);}
  if(boss)items.push([boss.z,drawBoss,null]);
  items.push([0.5,drawSquad,null]);
  items.sort((a,b)=>b[0]-a[0]);
  for(const it of items)it[1](it[2]);
  drawBullets();
  for(const z of zones)drawBeam(z);
  drawParts();
  drawAmbient();
  ctx.restore();
  if(flash){ctx.fillStyle='rgba('+flash.col+','+Math.min(0.35,flash.t)+')';ctx.fillRect(0,0,W,H);}
  const vg=ctx.createRadialGradient(W/2,H*0.55,H*0.35,W/2,H*0.55,H*0.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  drawHUD();
}

let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,sx};try{cv.setPointerCapture(e.pointerId);}catch(_){}ac();});

const endDrag=()=>drag=null;cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{if(['ArrowLeft','a','q','A','Q'].includes(e.key))keys.l=true;if(['ArrowRight','d','D'].includes(e.key))keys.r=true;});
addEventListener('keyup',e=>{if(['ArrowLeft','a','q','A','Q'].includes(e.key))keys.l=false;if(['ArrowRight','d','D'].includes(e.key))keys.r=false;});

// =====================================================================
//  Loop
// =====================================================================
addEventListener('resize',resize);
resize();showHub();
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(mode==='play'||mode==='over')update(dt);
  else{t+=dt;dist+=70*dt;for(const d of decor){d.z-=70*dt;if(d.z<-170)Object.assign(d,makeDeco(d.z+36*85));}}
  updateParts(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
