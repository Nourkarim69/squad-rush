<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<title>Fusion 2048</title>
<link rel="stylesheet" href="../shared/common.css">
</head>
<body>
<canvas class="game" id="c"></canvas>
<script src="../shared/common.js"></script>
<script>
Arcade.bar('Fusion 2048');
Arcade.barButton('↺',()=>newGame(),'Nouvelle partie');
const cv=document.getElementById('c'),V=Arcade.canvas(cv),ctx=V.ctx;
const N=4;
const TC={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#c9a6ff',2048:'#8f5bff'};
let tiles=[],score=0,over=false,start=null,reached=false;
function at(x,y){return tiles.find(t=>!t.dying&&t.x===x&&t.y===y);}
function empties(){const e=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(!at(x,y))e.push([x,y]);return e;}
function spawn(){const e=empties();if(!e.length)return;const[x,y]=e[Math.floor(Math.random()*e.length)];tiles.push({x,y,dx:x,dy:y,v:Math.random()<0.9?2:4,s:0,pop:0});}
function newGame(){tiles=[];score=0;over=false;reached=false;spawn();spawn();Arcade.hidePanel();}
function move(dir){
  if(over)return;
  const vec=[[-1,0],[1,0],[0,-1],[0,1]][dir];
  const xs=[0,1,2,3],ys=[0,1,2,3];if(vec[0]===1)xs.reverse();if(vec[1]===1)ys.reverse();
  tiles=tiles.filter(t=>!t.dying);tiles.forEach(t=>t.merged=false);
  let moved=false,gained=0;
  for(const x of xs)for(const y of ys){
    const t=at(x,y);if(!t)continue;
    let nx=x,ny=y;
    for(;;){
      const tx=nx+vec[0],ty=ny+vec[1];if(tx<0||ty<0||tx>=N||ty>=N)break;
      const o=at(tx,ty);
      if(!o){nx=tx;ny=ty;continue;}
      if(o.v===t.v&&!o.merged){t.dying=true;t.x=tx;t.y=ty;o.v*=2;o.merged=true;o.pop=1;gained+=o.v;moved=true;}
      break;
    }
    if(!t.dying&&(nx!==x||ny!==y)){t.x=nx;t.y=ny;moved=true;}
  }
  if(!moved)return;
  score+=gained;if(gained)Arcade.vibrate(8);
  setTimeout(()=>{tiles=tiles.filter(t=>!t.dying);},110);
  spawn();
  if(!reached&&tiles.some(t=>t.v>=2048)){reached=true;Arcade.addCoins(50);}
  if(!canMove()){over=true;setTimeout(gameOver,500);}
}
function canMove(){
  if(empties().length)return true;
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){const t=at(x,y);for(const[a,b]of[[1,0],[0,1]]){const o=at(x+a,y+b);if(o&&o.v===t.v)return true;}}
  return false;
}
function gameOver(){
  const gain=Arcade.addCoins(score/60),best=Arcade.best('merge',score);
  Arcade.panel({title:'Plus de place !',gain,text:'Score : '+score+' · Record : '+best,
    buttons:[{label:'Rejouer',onClick:newGame},{label:'Menu',onClick:Arcade.toMenu}]});
}
cv.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointerup',e=>{
  if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx<0?0:1);else move(dy<0?2:3);
});
addEventListener('keydown',e=>{const m={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(m!=null){e.preventDefault();move(m);}});

function frame(dt){
  const W=V.W,H=V.H;
  ctx.fillStyle='#faf6ee';ctx.fillRect(0,0,W,H);
  const size=Math.min(W-28,H-150,520),x0=(W-size)/2,y0=Math.max(110,(H-size)/2+30),gap=size*0.025,cs=(size-gap*(N+1))/N;
  // scores
  const best=Math.max(Arcade.get('best.merge',0),score);
  const bw=Math.min(130,(size-12)/2);
  [['SCORE',score,x0],['RECORD',best,x0+size-bw]].forEach(([l,v,x])=>{
    ctx.fillStyle='#bbada0';ctx.beginPath();ctx.roundRect(x,y0-88,bw,62,10);ctx.fill();
    ctx.fillStyle='#eee4da';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,x+bw/2,y0-72);
    ctx.fillStyle='#fff';ctx.font='900 24px system-ui';ctx.fillText(v,x+bw/2,y0-46);
  });
  ctx.fillStyle='#bbada0';ctx.beginPath();ctx.roundRect(x0,y0,size,size,12);ctx.fill();
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){ctx.fillStyle='rgba(238,228,218,.35)';ctx.beginPath();ctx.roundRect(x0+gap+x*(cs+gap),y0+gap+y*(cs+gap),cs,cs,8);ctx.fill();}
  const k=Math.min(1,dt*20);
  const order=tiles.slice().sort((a,b)=>(b.dying?1:0)-(a.dying?1:0));
  for(const t of order){
    t.dx+=(t.x-t.dx)*k;t.dy+=(t.y-t.dy)*k;t.s+=(1-t.s)*Math.min(1,dt*14);t.pop=Math.max(0,t.pop-dt*6);
    const sc=t.s*(1+t.pop*0.15),px=x0+gap+t.dx*(cs+gap)+cs/2,py=y0+gap+t.dy*(cs+gap)+cs/2,w=cs*sc;
    ctx.fillStyle=TC[t.v]||'#3c3a32';ctx.beginPath();ctx.roundRect(px-w/2,py-w/2,w,w,8);ctx.fill();
    ctx.fillStyle=t.v<=4?'#776e65':'#fff';
    const fs=cs*(t.v<100?0.45:t.v<1000?0.38:0.3)*sc;
    ctx.font='900 '+fs+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.v,px,py+fs*0.05);
  }
  ctx.fillStyle='#776e65';ctx.font='600 14px system-ui';ctx.textAlign='center';
  ctx.fillText('Glisse pour fusionner les tuiles identiques',W/2,Math.min(H-20,y0+size+30));
}
newGame();
Arcade.loop(frame);
</script>
</body>
</html>
